<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060610">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Periodic Table">
<link rel="manifest" href="manifest.json">
<title>Periodic Table — Plank Mode</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #060610;
    --accent: #00f5c4;
    --text: #f0f0f8;
    --muted: #5a5a7a;
    --card-border: rgba(255,255,255,0.07);
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,245,196,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,196,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 0; pointer-events: none;
  }

  /* ── Main layout ── */
  #main {
    position: relative; z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    padding-bottom: 52px; /* controls height */
  }

  /* ── LEFT panel: element detail ── */
  #detail {
    flex: 0 0 52%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: 8px 10px 8px 12px;
    gap: 0;
    border-right: 1px solid rgba(255,255,255,0.06);
    height: 100%;
  }
  .header-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .header-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase;
  }
  #el-counter {
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--accent); letter-spacing: 1px;
  }
  #cat-badge {
    font-size: 10px; font-family: 'Space Mono', monospace;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px; border: 1px solid;
    margin-bottom: 3px;
    transition: color 0.3s, border-color 0.3s, background 0.3s;
  }
  #el-number {
    font-family: 'Space Mono', monospace;
    font-size: 14px; color: var(--muted); letter-spacing: 2px;
  }
  #el-symbol {
    font-family: 'Space Mono', monospace;
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 700; line-height: 1.05; color: #fff;
    text-shadow: 0 0 40px rgba(0,245,196,0.25);
  }
  #el-name {
    font-size: clamp(15px, 3.2vw, 22px);
    font-weight: 300; color: rgba(240,240,248,0.8);
    letter-spacing: 0.5px; text-align: center;
  }
  #el-mass {
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--muted); letter-spacing: 1px;
    margin-top: 2px;
  }
  #shell-svg-wrap {
    width: min(170px, 36vw); height: min(170px, 36vw);
    margin: 6px auto 3px;
  }
  #shell-svg-wrap svg { width: 100%; height: 100%; }
  #el-shells {
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--accent); letter-spacing: 1px;
    text-align: center;
  }
  #el-config {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.5px;
    text-align: center;
    margin-top: 4px;
    line-height: 1.6;
    max-width: 100%;
    word-break: break-word;
  }

  /* ── RIGHT panel: periodic table ── */
  #table-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 6px 6px 4px;
    overflow: hidden;
  }
  #ptable-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #ptable-svg {
    width: 100%;
    height: 100%;
    max-height: 100%;
  }

  /* ── Controls ── */
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 9px 16px 12px;
    background: linear-gradient(transparent, var(--bg) 50%);
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 40px;
    padding: 7px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
  #play-btn {
    background: rgba(0,245,196,0.1);
    border-color: rgba(0,245,196,0.3);
    color: var(--accent);
    min-width: 82px; text-align: center;
  }

  /* ── Progress bar ── */
  #progress-track {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 2px; background: rgba(255,255,255,0.05); z-index: 11;
  }
  #progress-fill {
    height: 100%; width: 0%;
    background: var(--accent); box-shadow: 0 0 6px var(--accent);
    transition: background 0.3s;
  }

  .fade-in { animation: fadeIn 0.25s ease forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<div id="main">

    </div>
    <div id="el-shells">1</div>
    <div id="el-config">1s¹</div>
  </div>

  <!-- RIGHT: mini periodic table -->
  <div id="table-panel">
    <div id="ptable-wrap">
      <svg id="ptable-svg" viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" onclick="prevEl()">← prev</button>
  <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">⏸ pause</button>
  <button class="ctrl-btn" onclick="nextEl()">next →</button>
  <button class="ctrl-btn" onclick="resetEl()" style="border-color:rgba(255,100,100,0.3);color:rgba(255,130,130,0.8);">↺ reset</button>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

/* ── Build SVG periodic table ── */
const NS = 'http://www.w3.org/2000/svg';
/* Reserve left margin for period labels, top margin for group labels */
const LABEL_W = 11; /* px reserved on left for period numbers */
const LABEL_H = 9;  /* px reserved on top for group numbers */
const SVG_W = 390, SVG_H = 248;
const COLS = 18;
const MAIN_ROWS = 7;
const gridW = SVG_W - LABEL_W;
const gridH = SVG_H - LABEL_H;
const cellW = gridW / COLS;
const gapY = 4;
const cellH = (gridH - gapY) / (MAIN_ROWS + 0.5 + 2);

/* Update viewBox to match */
const svgEl = document.getElementById('ptable-svg');
svgEl.setAttribute('viewBox', '0 0 ' + SVG_W + ' ' + SVG_H);

const cellMap = {};

function ptY(row) {
  const base = LABEL_H;
  if (row <= 7) return base + (row - 1) * cellH;
  return base + 7 * cellH + gapY + (row - 8) * cellH;
}
function ptX(col) { return LABEL_W + (col - 1) * cellW; }

/* ── Group labels (1–18) across the top ── */
for (let g = 1; g <= 18; g++) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', ptX(g) + cellW / 2);
  t.setAttribute('y', LABEL_H - 1.5);
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('dominant-baseline', 'auto');
  t.setAttribute('font-size', Math.min(cellW * 0.38, 6.5));
  t.setAttribute('font-family', 'Space Mono, monospace');
  t.setAttribute('fill', 'rgba(255,255,255,0.28)');
  t.textContent = g;
  svgEl.appendChild(t);
}

/* ── Period labels (1–7) down the left ── */
for (let p = 1; p <= 7; p++) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', LABEL_W - 2);
  t.setAttribute('y', ptY(p) + cellH / 2);
  t.setAttribute('text-anchor', 'end');
  t.setAttribute('dominant-baseline', 'middle');
  t.setAttribute('font-size', Math.min(cellH * 0.42, 6.5));
  t.setAttribute('font-family', 'Space Mono, monospace');
  t.setAttribute('fill', 'rgba(255,255,255,0.28)');
  t.textContent = p;
  svgEl.appendChild(t);
}

elements.forEach(el => {
  const st = catStyle[el.cat] || catStyle["nonmetal"];
  const x = ptX(el.col);
  const y = ptY(el.row);
  const pad = 0.8;

  const g = document.createElementNS(NS, 'g');

  const rect = document.createElementNS(NS, 'rect');
  rect.setAttribute('x', x + pad);
  rect.setAttribute('y', y + pad);
  rect.setAttribute('width',  cellW - pad*2);
  rect.setAttribute('height', cellH - pad*2);
  rect.setAttribute('rx', '1');
  rect.setAttribute('fill', st.dim);
  rect.setAttribute('stroke', 'rgba(255,255,255,0.06)');
  rect.setAttribute('stroke-width', '0.4');
  g.appendChild(rect);

  const txt = document.createElementNS(NS, 'text');
  txt.setAttribute('x', x + cellW/2);
  txt.setAttribute('y', y + cellH/2 + 2.5);
  txt.setAttribute('text-anchor', 'middle');
  txt.setAttribute('dominant-baseline', 'middle');
  txt.setAttribute('font-size', Math.min(cellW * 0.42, cellH * 0.52));
  txt.setAttribute('font-family', 'Space Mono, monospace');
  txt.setAttribute('fill', st.color);
  txt.setAttribute('opacity', '0.45');
  txt.textContent = el.sym;
  g.appendChild(txt);

  /* atomic number shown only when highlighted */
  const zTxt = document.createElementNS(NS, 'text');
  zTxt.setAttribute('x', x + cellW / 2);
  zTxt.setAttribute('y', y + cellH * 0.22);
  zTxt.setAttribute('text-anchor', 'middle');
  zTxt.setAttribute('dominant-baseline', 'middle');
  zTxt.setAttribute('font-size', Math.min(cellW * 0.28, cellH * 0.3));
  zTxt.setAttribute('font-family', 'Space Mono, monospace');
  zTxt.setAttribute('fill', '#fff');
  zTxt.setAttribute('opacity', '0');
  zTxt.textContent = el.z;
  g.appendChild(zTxt);

  svgEl.appendChild(g);
  cellMap[el.z] = { g, rect, txt, zTxt, st };
});

/* Lanthanide/Actinide asterisk placeholders in main table */
['*','*'].forEach((label, i) => {
  const lx = ptX(3);
  const ly = ptY(6 + i) + cellH/2;
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', lx + cellW/2);
  t.setAttribute('y', ly);
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('dominant-baseline', 'middle');
  t.setAttribute('font-size', Math.min(cellW * 0.35, 6));
  t.setAttribute('font-family', 'Space Mono, monospace');
  t.setAttribute('fill', 'rgba(255,255,255,0.18)');
  t.textContent = label;
  svgEl.appendChild(t);
});

/* Collect group and period label nodes after they've been appended */
const groupLabels = {};
const periodLabels = {};
/* We'll populate these after the DOM is built, in a timeout */

let highlighted = null;
let hlGroup = null, hlPeriod = null;

function resetAxisLabels() {
  if (hlGroup && groupLabels[hlGroup]) {
    groupLabels[hlGroup].setAttribute('fill', 'rgba(255,255,255,0.28)');
    groupLabels[hlGroup].removeAttribute('font-weight');
  }
  if (hlPeriod && periodLabels[hlPeriod]) {
    periodLabels[hlPeriod].setAttribute('fill', 'rgba(255,255,255,0.28)');
    periodLabels[hlPeriod].removeAttribute('font-weight');
  }
  hlGroup = null; hlPeriod = null;
}

function highlightElement(z) {
  if (highlighted !== null && cellMap[highlighted]) {
    const prev = cellMap[highlighted];
    prev.rect.setAttribute('fill', prev.st.dim);
    prev.rect.setAttribute('stroke', 'rgba(255,255,255,0.06)');
    prev.rect.setAttribute('stroke-width', '0.4');
    prev.txt.setAttribute('opacity', '0.45');
    prev.txt.setAttribute('fill', prev.st.color);
    if (prev.zTxt) prev.zTxt.setAttribute('opacity', '0');
  }
  resetAxisLabels();
  highlighted = z;
  const elData = elements.find(e => e.z === z);
  if (cellMap[z]) {
    const c = cellMap[z];
    c.rect.setAttribute('fill', c.st.fill);
    c.rect.setAttribute('stroke', c.st.border);
    c.rect.setAttribute('stroke-width', '1.2');
    c.txt.setAttribute('opacity', '1');
    c.txt.setAttribute('fill', '#fff');
    if (c.zTxt) c.zTxt.setAttribute('opacity', '0.85');
    /* Highlight axis labels for main-table elements only */
    if (elData && elData.row <= 7) {
      hlGroup = elData.col;
      hlPeriod = elData.row;
      if (groupLabels[hlGroup]) {
        groupLabels[hlGroup].setAttribute('fill', c.st.color);
        groupLabels[hlGroup].setAttribute('font-weight', 'bold');
      }
      if (periodLabels[hlPeriod]) {
        periodLabels[hlPeriod].setAttribute('fill', c.st.color);
        periodLabels[hlPeriod].setAttribute('font-weight', 'bold');
      }
    }
  }
}

/* Populate axis label maps after SVG is built */
setTimeout(() => {
  svgEl.querySelectorAll('text').forEach(t => {
    const v = parseInt(t.textContent);
    if (isNaN(v)) return;
    const anchor = t.getAttribute('text-anchor');
    const yVal = parseFloat(t.getAttribute('y'));
    if (anchor === 'middle' && v >= 1 && v <= 18 && yVal <= LABEL_H) {
      groupLabels[v] = t;
    } else if (anchor === 'end' && v >= 1 && v <= 7) {
      periodLabels[v] = t;
    }
  });
}, 0);

/* ── Shell diagram ── */
function drawShells(shells, accentColor) {
  const svg = document.getElementById('shell-svg');
  svg.innerHTML = '';
  const cx = 110, cy = 110;
  const n = shells.length;
  const maxR = 98, minR = 16;
  const step = n > 1 ? (maxR - minR) / (n - 1) : 0;
  for (let i = 0; i < n; i++) {
    const r = n === 1 ? minR : minR + i * step;
    const orbit = document.createElementNS(NS, 'circle');
    orbit.setAttribute('cx', cx); orbit.setAttribute('cy', cy);
    orbit.setAttribute('r', r); orbit.setAttribute('fill', 'none');
    orbit.setAttribute('stroke', 'rgba(255,255,255,0.1)');
    orbit.setAttribute('stroke-width', '1');
    svg.appendChild(orbit);
    const count = shells[i];
    const dotR = count > 20 ? 2.2 : 3.5;
    for (let j = 0; j < count; j++) {
      const angle = (j / count) * 2 * Math.PI - Math.PI / 2;
      const ex = cx + r * Math.cos(angle);
      const ey = cy + r * Math.sin(angle);
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', ex); dot.setAttribute('cy', ey);
      dot.setAttribute('r', dotR);
      dot.setAttribute('fill', accentColor || '#00f5c4');
      dot.setAttribute('opacity', '0.9');
      svg.appendChild(dot);
    }
  }
  const glow = document.createElementNS(NS, 'circle');
  glow.setAttribute('cx', cx); glow.setAttribute('cy', cy);
  glow.setAttribute('r', 12); glow.setAttribute('fill', 'rgba(255,255,255,0.15)');
  svg.appendChild(glow);
  const nuc = document.createElementNS(NS, 'circle');
  nuc.setAttribute('cx', cx); nuc.setAttribute('cy', cy);
  nuc.setAttribute('r', 6); nuc.setAttribute('fill', '#fff');
  svg.appendChild(nuc);
}

/* ── Show element ── */
let current = 0, playing = true, startTime = null, elapsed = 0, raf = null;
const DURATION = 3000;

function showElement(idx) {
  const el = elements[idx];
  const st = catStyle[el.cat] || catStyle["nonmetal"];

  document.getElementById('el-number').textContent = 'Z = ' + el.z;
  document.getElementById('el-symbol').textContent = el.sym;
  document.getElementById('el-name').textContent = el.name;
  document.getElementById('el-mass').textContent = 'mass: ' + el.mass + ' u';
  document.getElementById('el-shells').textContent = 'shells: ' + el.shells.join(' — ');
  document.getElementById('el-config').textContent = configs[el.z] || '';
  document.getElementById('el-counter').textContent = el.z + ' / 118';

  const badge = document.getElementById('cat-badge');
  badge.textContent = el.cat;
  badge.style.color = st.color;
  badge.style.background = st.fill;
  badge.style.borderColor = st.border;

  document.getElementById('progress-fill').style.background = st.color;
  document.getElementById('progress-fill').style.boxShadow = '0 0 6px ' + st.color;

  drawShells(el.shells, st.color);
  highlightElement(el.z);

  ['el-symbol','el-name','el-mass','el-shells','el-config','cat-badge'].forEach(id => {
    const node = document.getElementById(id);
    node.classList.remove('fade-in');
    void node.offsetWidth;
    node.classList.add('fade-in');
  });
}

function tick() {
  if (!playing) return;
  const now = performance.now();
  elapsed = now - startTime;
  const pct = Math.min((elapsed / DURATION) * 100, 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  if (elapsed >= DURATION) {
    elapsed = 0;
    current = (current + 1) % elements.length;
    showElement(current);
    startTime = performance.now();
  }
  raf = requestAnimationFrame(tick);
}
function startTick() { startTime = performance.now() - elapsed; raf = requestAnimationFrame(tick); }
function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸ pause' : '▶ play';
  if (playing) startTick(); else cancelAnimationFrame(raf);
}
function resetEl() {
  elapsed = 0;
  current = 0;
  document.getElementById('progress-fill').style.width = '0%';
  showElement(current);
  if (!playing) {
    playing = true;
    document.getElementById('play-btn').textContent = '⏸ pause';
  }
  cancelAnimationFrame(raf);
  startTick();
}

function nextEl() {
  elapsed = 0; document.getElementById('progress-fill').style.width = '0%';
  current = (current + 1) % elements.length; showElement(current);
  if (playing) { cancelAnimationFrame(raf); startTick(); }
}
function prevEl() {
  elapsed = 0; document.getElementById('progress-fill').style.width = '0%';
  current = (current - 1 + elements.length) % elements.length; showElement(current);
  if (playing) { cancelAnimationFrame(raf); startTick(); }
}

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) dx < 0 ? nextEl() : prevEl();
}, {passive:true});

if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

showElement(0);
startTick();
